name: Test Code
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "2.5.1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Flake8
        run: poetry run flake8 .

      - name: Formatting (ruff format, black style)
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://cinema:cinema@localhost:5432/cinema
      TEST_DATABASE_URL: postgresql+asyncpg://cinema:cinema@localhost:5432/cinema_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      EMAIL_HOSTNAME: localhost
      EMAIL_PORT: "1025"
      EMAIL_USERNAME: noreply@cinema.test
      EMAIL_PASSWORD: ""
      EMAIL_USE_TLS: "false"
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_real_secret
      STRIPE_SUCCESS_URL: http://test/success?session_id={CHECKOUT_SESSION_ID}
      STRIPE_CANCEL_URL: http://test/cancel
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Pytest with coverage
        run: poetry run pytest -n 4 --cov --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: |
          cp .env.sample .env
          docker compose config --quiet

      - name: Build the app image
        run: docker compose build app

  deploy:
    name: Deploy to AWS EC2
    # Only after a merge into main, and only when every check above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, tests, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      APP_DIR: ${{ vars.EC2_APP_DIR || 'Online-Cinema' }}
    steps:
      - name: Check that the server secrets are set
        id: server
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::warning::EC2_HOST, EC2_USER or EC2_SSH_KEY is not set in the repository secrets, deploy skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.server.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull the code and restart the containers
        if: steps.server.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "APP_DIR='$APP_DIR' bash -s" <<'SCRIPT'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          # Rebuilds the image; the migrations service applies new migrations before the app starts.
          docker compose up -d --build
          docker image prune -f
          SCRIPT

      - name: Check that the API answers
        if: steps.server.outputs.ready == 'true'
        run: |
          # The docs are behind HTTP Basic, so a running app answers 401 there.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST:8000/api/v1/docs" || true)
            if [ "$code" = "401" ]; then
              echo "The API is up"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API did not answer after the deploy (last status: $code)"
          exit 1
