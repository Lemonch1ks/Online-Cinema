name: Deploy

# Runs after the CI workflow ("Test Code") finishes on main, and deploys only if it passed.
# A separate workflow cannot use `needs:` on CI jobs, so it waits for the whole CI run instead.
on:
  workflow_run:
    workflows: ["Test Code"]
    types: [completed]
    branches: [main]
  # Manual redeploy of the current main: Actions -> Deploy -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    # After a push (merge) into main with green CI; CI runs of pull requests are not deployed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      APP_DIR: ${{ vars.EC2_APP_DIR || 'Online-Cinema' }}
      # The commit CI has checked (for a manual run: the current main).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check that the server secrets are set
        id: server
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::warning::EC2_HOST, EC2_USER or EC2_SSH_KEY is not set in the repository secrets, deploy skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.server.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull the code and restart the containers
        if: steps.server.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "APP_DIR='$APP_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'SCRIPT'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch origin main
          git checkout main
          # Exactly the commit CI has checked, never anything newer that has not passed yet.
          git merge --ff-only "$DEPLOY_SHA"
          # Rebuilds the image; the migrations service applies new migrations before the app starts.
          docker compose up -d --build
          docker image prune -f
          SCRIPT

      - name: Check that the API answers
        if: steps.server.outputs.ready == 'true'
        run: |
          # The docs are behind HTTP Basic, so a running app answers 401 there.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST:8000/api/v1/docs" || true)
            if [ "$code" = "401" ]; then
              echo "The API is up"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API did not answer after the deploy (last status: $code)"
          exit 1
